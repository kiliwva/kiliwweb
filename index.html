<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</head>
<body>
  <main class="auth">
    <div class="card">

      <!-- Sign in / Sign up switch -->
      <nav class="tabs" role="tablist" aria-label="Sign in or sign up">
        <button class="tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login">Sign in</button>
        <button class="tab" id="tab-register" role="tab" aria-selected="false" aria-controls="form-register">Sign up</button>
      </nav>

      <!-- Sign in -->
      <form class="form active" id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <h1 class="title">Welcome back</h1>
        <p class="subtitle">Enter your details to sign in</p>

        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <span class="field-error"></span>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" minlength="8" required>
          <span class="field-error"></span>
        </div>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled>Sign in</button>

        <p class="note"><a class="link" href="#">Forgot password?</a></p>
      </form>

      <!-- Sign up -->
      <form class="form" id="form-register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
        <h1 class="title">Create account</h1>
        <p class="subtitle">It takes less than a minute</p>

        <div class="field">
          <label for="reg-name">Name</label>
          <input type="text" id="reg-name" name="name" placeholder="Your name" autocomplete="name" required>
          <span class="field-error"></span>
        </div>

        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <span class="field-error"></span>
        </div>

        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
          <span class="field-error"></span>
        </div>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled>Sign up</button>
      </form>

      <!-- Success -->
      <div class="success" id="success-panel" hidden>
        <div class="success-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L20 7"/></svg>
        </div>
        <h1 class="title">Done</h1>
        <p class="subtitle" id="success-text">You are signed in.</p>
        <button type="button" class="submit" id="success-back">Back</button>
      </div>

    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
