<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiliw — Вход</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✳️</text></svg>">
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</head>
<body>
  <div class="page">

    <!-- Декоративный фон -->
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-2" aria-hidden="true"></div>

    <main class="card" role="main">

      <!-- Логотип-«вспышка» в стиле Claude -->
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <g fill="currentColor">
            <path d="M32 4c1.4 0 2.5 1.1 2.6 2.5l1 15.1c.1 2.1-2.2 3.5-4 2.4-.7-.5-1.2-1.3-1.2-2.2l-1-15.3C29.5 5.1 30.6 4 32 4Z"/>
            <path d="M32 60c-1.4 0-2.5-1.1-2.6-2.5l-1-15.1c-.1-2.1 2.2-3.5 4-2.4.7.5 1.2 1.3 1.2 2.2l1 15.3c.1 1.4-1 2.5-2.6 2.5Z"/>
            <path d="M4 32c0-1.4 1.1-2.5 2.5-2.6l15.1-1c2.1-.1 3.5 2.2 2.4 4-.5.7-1.3 1.2-2.2 1.2l-15.3 1C5.1 34.5 4 33.4 4 32Z"/>
            <path d="M60 32c0 1.4-1.1 2.5-2.5 2.6l-15.1 1c-2.1.1-3.5-2.2-2.4-4 .5-.7 1.3-1.2 2.2-1.2l15.3-1c1.4-.1 2.5 1 2.5 2.6Z"/>
            <path d="M12.2 12.2c1-1 2.6-1 3.6 0l10.1 10.6c1.4 1.5.4 4-1.7 4.1-.8 0-1.6-.3-2.1-.9L11.7 15.5c-.9-1-.5-2.4.5-3.3Z"/>
            <path d="M51.8 51.8c-1 1-2.6 1-3.6 0L38.1 41.2c-1.4-1.5-.4-4 1.7-4.1.8 0 1.6.3 2.1.9l10.4 10.5c.9 1 .5 2.4-.5 3.3Z"/>
            <path d="M12.2 51.8c-1-1-1-2.6 0-3.6l10.6-10.1c1.5-1.4 4-.4 4.1 1.7 0 .8-.3 1.6-.9 2.1L15.5 52.3c-1 .9-2.4.5-3.3-.5Z"/>
            <path d="M51.8 12.2c1 1 1 2.6 0 3.6L41.2 25.9c-1.5 1.4-4 .4-4.1-1.7 0-.8.3-1.6.9-2.1l10.5-10.4c1-.9 2.4-.5 3.3.5Z"/>
          </g>
        </svg>
        <span class="brand-name">Kiliw</span>
      </div>

      <!-- Переключатель Вход / Регистрация -->
      <div class="tabs" role="tablist" aria-label="Вход или регистрация">
        <button class="tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login">Вход</button>
        <button class="tab" id="tab-register" role="tab" aria-selected="false" aria-controls="form-register">Регистрация</button>
        <span class="tab-slider" aria-hidden="true"></span>
      </div>

      <!-- Форма входа -->
      <form class="form active" id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <h1 class="form-title">С возвращением</h1>
        <p class="form-subtitle">Войдите, чтобы продолжить</p>

        <div class="field">
          <label for="login-email">Электронная почта</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <span class="field-error"></span>
        </div>

        <div class="field">
          <label for="login-password">Пароль</label>
          <div class="password-wrap">
            <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" minlength="8" required>
            <button type="button" class="toggle-password" aria-label="Показать пароль">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="field-error"></span>
        </div>

        <div class="form-row">
          <label class="checkbox">
            <input type="checkbox" name="remember">
            <span class="checkbox-box" aria-hidden="true"></span>
            Запомнить меня
          </label>
          <a class="link" href="#">Забыли пароль?</a>
        </div>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled>
          <span class="submit-label">Войти</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p class="form-note">Нет аккаунта? <a class="link" href="#" data-switch="register">Зарегистрируйтесь</a></p>
      </form>

      <!-- Форма регистрации -->
      <form class="form" id="form-register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
        <h1 class="form-title">Создать аккаунт</h1>
        <p class="form-subtitle">Это займёт меньше минуты</p>

        <div class="field">
          <label for="reg-name">Имя</label>
          <input type="text" id="reg-name" name="name" placeholder="Как к вам обращаться" autocomplete="name" required>
          <span class="field-error"></span>
        </div>

        <div class="field">
          <label for="reg-email">Электронная почта</label>
          <input type="email" id="reg-email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <span class="field-error"></span>
        </div>

        <div class="field">
          <label for="reg-password">Пароль</label>
          <div class="password-wrap">
            <input type="password" id="reg-password" name="password" placeholder="Минимум 8 символов" autocomplete="new-password" minlength="8" required>
            <button type="button" class="toggle-password" aria-label="Показать пароль">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="strength" aria-hidden="true">
            <span class="strength-bar"></span>
            <span class="strength-bar"></span>
            <span class="strength-bar"></span>
          </div>
          <span class="field-error"></span>
        </div>

        <label class="checkbox terms">
          <input type="checkbox" name="terms" required>
          <span class="checkbox-box" aria-hidden="true"></span>
          <span>Я принимаю <a class="link" href="#">условия использования</a></span>
        </label>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled>
          <span class="submit-label">Создать аккаунт</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p class="form-note">Уже есть аккаунт? <a class="link" href="#" data-switch="login">Войдите</a></p>
      </form>

      <!-- Сообщение об успехе -->
      <div class="success" id="success-panel" hidden>
        <svg class="success-icon" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="success-circle" cx="26" cy="26" r="24" fill="none"/>
          <path class="success-check" fill="none" d="M14 27l8 8 16-17"/>
        </svg>
        <h2>Готово!</h2>
        <p id="success-text">Вы успешно вошли в систему.</p>
        <button type="button" class="submit" id="success-back">Вернуться</button>
      </div>

    </main>

    <footer class="page-footer">
      Защищено <a class="link" href="https://www.cloudflare.com/products/turnstile/" target="_blank" rel="noopener">Cloudflare Turnstile</a>
    </footer>
  </div>

  <script src="auth.js"></script>
</body>
</html>
