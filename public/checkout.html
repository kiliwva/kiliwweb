<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0C0C0C">
  <title>Checkout</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>

<body data-title-key="title.checkout">

  <div class="scene">
    <!-- Ambient background -->
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <main class="card checkout-card">

)"/><rect x="63" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="67.5" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="58.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="67.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="58.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="67.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="58.5" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="63" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="67.5" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="76.5" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="85.5" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="76.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="85.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="76.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="85.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="76.5" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="81" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="85.5" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="94.5" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="99" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="94.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="103.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="94.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="103.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="94.5" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="99" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/></svg> <span class="pro-mark">Pro</span>
        </span>
        <a class="ghost-btn" href="/dash" data-i18n="checkout.back">Back</a>
      </div>

      <h1 class="title" id="co-title">…</h1>
      <p class="subtitle" data-i18n="plan.period">One-time payment, active for 30 days.</p>

      <div class="co-summary">
        <div class="co-row"><span data-i18n="checkout.price">Price</span><strong id="co-price"></strong></div>
        <div class="co-row" id="co-discount-row" hidden><span data-i18n="checkout.discount">Discount</span><strong id="co-discount"></strong></div>
        <div class="co-row" id="co-upgrade-row" hidden><span data-i18n="checkout.upgrade">Upgrade bonus</span><strong id="co-upgrade"></strong></div>
        <div class="co-row co-total"><span data-i18n="checkout.total">Total</span><strong id="co-total"></strong></div>
        <p class="co-rub" id="co-rub" hidden></p>
      </div>

      <!-- promo code -->
      <div class="share-link co-promo">
        <input type="text" id="promo-input" placeholder="Promo code" autocomplete="off">
        <button type="button" class="submit small" id="promo-apply" data-i18n="checkout.apply">Apply</button>
      </div>
      <p class="modal-status" id="promo-status" hidden></p>

      <!-- payment method -->
      <p class="otp-label" data-i18n="checkout.method">Payment method</p>
      <div class="pay-pick">
        <button type="button" class="pay-card" id="pm-yookassa">
          <strong data-i18n="checkout.cardMethod">Bank card</strong>
          <span>YooKassa · RUB</span>
        </button>
        <button type="button" class="pay-card" id="pm-heleket">
          <strong data-i18n="checkout.cryptoMethod">Crypto</strong>
          <span>Heleket · USD</span>
        </button>
      </div>

      <p class="modal-status" id="co-status" hidden></p>
      <button type="submit" class="submit" id="co-pay" data-i18n="checkout.pay">Continue to payment</button>
    </main>
  </div>

  <script src="ui.js?v=67"></script>
  <script src="checkout.js?v=67"></script>
</body>
</html>
