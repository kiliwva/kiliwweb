<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0C0C0C">
  <title>Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=29">
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</head>
<body data-title-key="title.auth">


  <div class="scene">
    <!-- Ambient background -->
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <main class="card">

      <!-- Brand -->
      <div class="auth-brand">
                  <span class="wordmark">kiliw<em>cloud</em></span>
      </div>

      <!-- Sign in / Sign up switch -->
      <nav class="tabs" role="tablist" aria-label="Sign in or sign up">
        <span class="tab-thumb" aria-hidden="true"></span>
        <button class="tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login" data-i18n="tab.signin">Sign In</button>
        <button class="tab" id="tab-register" role="tab" aria-selected="false" aria-controls="form-register" data-i18n="tab.signup">Sign Up</button>
      </nav>

      <!-- Sign in -->
      <form class="form active" id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <h1 class="title" data-i18n="auth.welcome">Welcome back.</h1>
        <p class="subtitle" data-i18n="auth.subLogin">Sign in to continue where you left off.</p>

        <div class="group">
          <div class="field">
            <input type="email" id="login-email" name="email" placeholder=" " autocomplete="email" required>
            <label for="login-email" data-i18n="label.email">Email</label>
          </div>
          <div class="divider"></div>
          <div class="field">
            <input type="password" id="login-password" name="password" placeholder=" " autocomplete="current-password" minlength="8" required>
            <label for="login-password" data-i18n="label.password">Password</label>
          </div>
        </div>

        <!-- 2FA code (shown only when the account has 2FA enabled) -->
        <div class="totp-group" id="login-totp-group" hidden>
          <p class="otp-label" data-i18n="label.totp">2FA code from your authenticator app</p>
          <div class="otp" id="login-totp-otp" data-otp data-otp-target="login-totp"></div>
          <input type="hidden" id="login-totp" name="code">
        </div>
        <p class="group-error" data-error></p>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled data-i18n="btn.signin">Sign In</button>

        <p class="note"><a class="link" href="#" data-i18n="auth.forgot">Forgot password?</a></p>
      </form>

      <!-- Sign up -->
      <form class="form" id="form-register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
        <h1 class="title" data-i18n="auth.create">Create yours.</h1>
        <p class="subtitle" data-i18n="auth.subReg">One account. Less than a minute.</p>

        <div class="group">
          <div class="field">
            <input type="email" id="reg-email" name="email" placeholder=" " autocomplete="email" required>
            <label for="reg-email" data-i18n="label.email">Email</label>
          </div>
          <div class="divider"></div>
          <div class="field">
            <input type="password" id="reg-password" name="password" placeholder=" " autocomplete="new-password" minlength="8" required>
            <label for="reg-password" data-i18n="label.password">Password</label>
          </div>
        </div>
        <p class="group-error" data-error></p>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled data-i18n="btn.create">Create Account</button>

        <p class="note muted" data-i18n-html="auth.terms">By continuing you agree to the <a class="link" href="#">Terms of Service</a>.</p>
      </form>

      <!-- Email verification step -->
      <form class="form" id="form-verify" novalidate hidden>
        <h1 class="title" data-i18n="verify.title">Check your email.</h1>
        <p class="subtitle" id="verify-sub"></p>

        <p class="otp-label" data-i18n="verify.code">Verification code</p>
        <div class="otp" id="verify-otp" data-otp data-otp-target="verify-code"></div>
        <input type="hidden" id="verify-code">
        <p class="group-error" data-error></p>

        <button type="submit" class="submit verify-submit" data-i18n="verify.confirm">Verify & create account</button>

        <p class="note"><a class="link" href="#" id="verify-resend" data-i18n="verify.resend">Send the code again</a></p>
        <p class="note muted"><a class="link" href="#" id="verify-back" data-i18n="verify.back">Back</a></p>
      </form>

    </main>
  </div>

  <script src="ui.js?v=29"></script>
  <script src="auth.js?v=29"></script>
</body>
</html>
