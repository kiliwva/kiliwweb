<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0C0C0C">
  <title>Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=67">
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</head>
<body data-title-key="title.auth">

  <div class="brand-intro" id="brand-intro" aria-hidden="true">
    <div class="bi-stage">
      <i class="bi-cell" style="left:0px;top:0px;--fx:-80px;--fy:-90px;--cx:45px;--cy:68px;--d:0s"></i>
      <i class="bi-cell" style="left:0px;top:45px;--fx:-110px;--fy:-30px;--cx:45px;--cy:23px;--d:.05s"></i>
      <i class="bi-cell" style="left:0px;top:90px;--fx:-90px;--fy:40px;--cx:45px;--cy:-22px;--d:.1s"></i>
      <i class="bi-cell" style="left:0px;top:135px;--fx:-70px;--fy:110px;--cx:45px;--cy:-67px;--d:.15s"></i>
      <i class="bi-cell g" style="left:45px;top:45px;--fx:30px;--fy:-110px;--cx:0px;--cy:23px;--d:.08s"></i>
      <i class="bi-cell g" style="left:90px;top:0px;--fx:90px;--fy:-80px;--cx:-45px;--cy:68px;--d:.12s"></i>
      <i class="bi-cell g" style="left:45px;top:90px;--fx:40px;--fy:120px;--cx:0px;--cy:-22px;--d:.16s"></i>
      <i class="bi-cell g" style="left:90px;top:135px;--fx:100px;--fy:90px;--cx:-45px;--cy:-67px;--d:.2s"></i>
      <span class="bi-pixel"></span>
      <svg class="bi-id" viewBox="0 0 21.6 17.1" aria-label="ID"><defs><linearGradient id="kwg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2A47B"/><stop offset=".55" stop-color="#D97757"/><stop offset="1" stop-color="#B4552F"/></linearGradient></defs><rect x="0" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="0" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="0" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="0" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="9" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="13.5" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="9" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="18" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="9" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="18" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="9" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="13.5" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/></svg>
    </div>
  </div>



  <div class="scene">
    <!-- Ambient background -->
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <main class="card">

      <!-- Brand -->
      <div class="auth-brand">
        <svg class="brand-lock" style="height:20px;width:51.58px" viewBox="0 0 44.1 17.1" role="img" aria-label="K-ID"><defs><linearGradient id="kwg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2A47B"/><stop offset=".55" stop-color="#D97757"/><stop offset="1" stop-color="#B4552F"/></linearGradient></defs><rect x="0" y="0" width="3.6" height="3.6" rx="1.1" fill="#F2F2F2"/><rect x="0" y="4.5" width="3.6" height="3.6" rx="1.1" fill="#F2F2F2"/><rect x="0" y="9" width="3.6" height="3.6" rx="1.1" fill="#F2F2F2"/><rect x="0" y="13.5" width="3.6" height="3.6" rx="1.1" fill="#F2F2F2"/><rect x="4.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="9" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="4.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="9" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="15.75" y="6.75" width="3.6" height="3.6" rx="1.1" fill="#F2F2F2"/><rect x="22.5" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="22.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="22.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="22.5" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="31.5" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="36" y="0" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="31.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="40.5" y="4.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="31.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="40.5" y="9" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="31.5" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/><rect x="36" y="13.5" width="3.6" height="3.6" rx="1.1" fill="url(#kwg)"/></svg>
      </div>

      <!-- Sign in / Sign up switch -->
      <nav class="tabs" role="tablist" aria-label="Sign in or sign up">
        <span class="tab-thumb" aria-hidden="true"></span>
        <button class="tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login" data-i18n="tab.signin">Sign In</button>
        <button class="tab" id="tab-register" role="tab" aria-selected="false" aria-controls="form-register" data-i18n="tab.signup">Sign Up</button>
      </nav>

      <!-- Sign in -->
      <form class="form active" id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <h1 class="title" data-i18n="auth.welcome">Welcome back.</h1>
        <p class="subtitle" data-i18n="auth.subLogin">Sign in to continue where you left off.</p>

        <div class="group">
          <div class="field">
            <input type="email" id="login-email" name="email" placeholder=" " autocomplete="email" required>
            <label for="login-email" data-i18n="label.email">Email</label>
          </div>
          <div class="divider"></div>
          <div class="field">
            <input type="password" id="login-password" name="password" placeholder=" " autocomplete="current-password" minlength="8" required>
            <label for="login-password" data-i18n="label.password">Password</label>
          </div>
        </div>

        <!-- 2FA code (shown only when the account has 2FA enabled) -->
        <div class="totp-group" id="login-totp-group" hidden>
          <p class="otp-label" data-i18n="label.totp">2FA code from your authenticator app</p>
          <div class="otp" id="login-totp-otp" data-otp data-otp-target="login-totp"></div>
          <input type="hidden" id="login-totp" name="code">
        </div>
        <p class="group-error" data-error></p>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled data-i18n="btn.signin">Sign In</button>

        <button type="button" class="passkey-btn" id="passkey-login" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="4.5"/><path d="M2.5 21v-1.5a6 6 0 0 1 6-6h.5"/><path d="M21.5 11.5a3 3 0 1 0-4.5 2.6V20l1.5 1.5L20 20l-1-1 1-1-1-1 1.5-1.5v-1.4a3 3 0 0 0 1-2.6Z"/></svg>
          <span data-i18n="pk.signin">Sign in with a passkey</span>
        </button>
        <p class="modal-status" id="passkey-login-status" hidden></p>

        <p class="note"><a class="link" href="/reset" data-i18n="auth.forgot">Forgot password?</a></p>
      </form>

      <!-- Sign up -->
      <form class="form" id="form-register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
        <h1 class="title" data-i18n="auth.create">Create yours.</h1>
        <p class="subtitle" data-i18n="auth.subReg">One account. Less than a minute.</p>

        <div class="group">
          <div class="field">
            <input type="email" id="reg-email" name="email" placeholder=" " autocomplete="email" required>
            <label for="reg-email" data-i18n="label.email">Email</label>
          </div>
          <div class="divider"></div>
          <div class="field">
            <input type="password" id="reg-password" name="password" placeholder=" " autocomplete="new-password" minlength="8" required>
            <label for="reg-password" data-i18n="label.password">Password</label>
          </div>
        </div>
        <p class="group-error" data-error></p>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled data-i18n="btn.create">Create Account</button>

        <p class="note muted" data-i18n-html="auth.terms">By continuing you agree to the <a class="link" href="#">Terms of Service</a>.</p>
      </form>

      <!-- Email verification step -->
      <form class="form" id="form-verify" novalidate hidden>
        <h1 class="title" data-i18n="verify.title">Check your email.</h1>
        <p class="subtitle" id="verify-sub"></p>

        <p class="otp-label" data-i18n="verify.code">Verification code</p>
        <div class="otp" id="verify-otp" data-otp data-otp-target="verify-code"></div>
        <input type="hidden" id="verify-code">
        <p class="group-error" data-error></p>

        <button type="submit" class="submit verify-submit" data-i18n="verify.confirm">Verify & create account</button>

        <p class="note"><a class="link" href="#" id="verify-resend" data-i18n="verify.resend">Send the code again</a></p>
        <p class="note muted"><a class="link" href="#" id="verify-back" data-i18n="verify.back">Back</a></p>
      </form>

    </main>
  </div>

  <script src="ui.js?v=67"></script>
  <script src="auth.js?v=67"></script>
  <script>
    (function () {
      var el = document.getElementById('brand-intro');
      if (!el) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return; }
      setTimeout(function () { el.classList.add('done'); }, 1900);
      setTimeout(function () { el.remove(); }, 2350);
    })();
  </script>
</body>
</html>
