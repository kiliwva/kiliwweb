<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0C0C0C">
  <title>Reset password — Kiliw Cloud</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=71">
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
  <style>
    /* ============================================================
       Brand intro: the pixel K assembles, collapses into one pixel,
       and it bursts into the K-ID wordmark. Everything, including
       the final fade-out, is plain CSS animation: no JS timers (iOS
       system sheets freeze them) and no CSS variables (iOS Safari
       drops animations that carry var()). The overlay never captures
       taps.
       ============================================================ */
    .brand-intro {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: grid;
      place-items: center;
      pointer-events: none;
      background: linear-gradient(160deg, #262626 0%, #161616 52%, #0C0C0C 100%);
      animation: bi-out 0.4s ease 2.1s forwards;
    }
    .brand-intro.solo { animation-delay: 1.15s; }
    .brand-intro.done { opacity: 0; visibility: hidden; }
    @keyframes bi-out {
      to { opacity: 0; visibility: hidden; }
    }
    .bi-stage { position: relative; width: 78px; height: 106px; }
    .bi-cell {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: #F2F2F2;
      opacity: 0;
      animation-duration: 0.5s, 0.36s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), cubic-bezier(0.55, 0, 0.8, 0.4);
      animation-fill-mode: forwards, forwards;
    }
    .bi-cell.g { background: linear-gradient(135deg, #F2A47B 0%, #D97757 60%, #B4552F 100%); }
    .brand-intro.solo .bi-cell {
      animation-duration: 0.5s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      animation-fill-mode: forwards;
    }
    .bi-cell.c1 {
      left: 0px;
      top: 0px;
      animation-name: bi-in-1, bi-merge-1;
      animation-delay: 0.0s, 0.78s;
    }
    .brand-intro.solo .bi-cell.c1 {
      animation-name: bi-in-1;
      animation-delay: 0.0s;
    }
    @keyframes bi-in-1 {
      from { opacity: 0; transform: translate(-50px, -56px) scale(0.3); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes bi-merge-1 {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translate(28px, 42px) scale(0.5); }
    }
    .bi-cell.c2 {
      left: 0px;
      top: 28px;
      animation-name: bi-in-2, bi-merge-2;
      animation-delay: 0.05s, 0.78s;
    }
    .brand-intro.solo .bi-cell.c2 {
      animation-name: bi-in-2;
      animation-delay: 0.05s;
    }
    @keyframes bi-in-2 {
      from { opacity: 0; transform: translate(-68px, -19px) scale(0.3); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes bi-merge-2 {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translate(28px, 14px) scale(0.5); }
    }
    .bi-cell.c3 {
      left: 0px;
      top: 56px;
      animation-name: bi-in-3, bi-merge-3;
      animation-delay: 0.1s, 0.78s;
    }
    .brand-intro.solo .bi-cell.c3 {
      animation-name: bi-in-3;
      animation-delay: 0.1s;
    }
    @keyframes bi-in-3 {
      from { opacity: 0; transform: translate(-56px, 25px) scale(0.3); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes bi-merge-3 {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translate(28px, -14px) scale(0.5); }
    }
    .bi-cell.c4 {
      left: 0px;
      top: 84px;
      animation-name: bi-in-4, bi-merge-4;
      animation-delay: 0.15s, 0.78s;
    }
    .brand-intro.solo .bi-cell.c4 {
      animation-name: bi-in-4;
      animation-delay: 0.15s;
    }
    @keyframes bi-in-4 {
      from { opacity: 0; transform: translate(-43px, 68px) scale(0.3); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes bi-merge-4 {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translate(28px, -42px) scale(0.5); }
    }
    .bi-cell.c5 {
      left: 28px;
      top: 28px;
      animation-name: bi-in-5, bi-merge-5;
      animation-delay: 0.08s, 0.78s;
    }
    .brand-intro.solo .bi-cell.c5 {
      animation-name: bi-in-5;
      animation-delay: 0.08s;
    }
    @keyframes bi-in-5 {
      from { opacity: 0; transform: translate(19px, -68px) scale(0.3); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes bi-merge-5 {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translate(0px, 14px) scale(0.5); }
    }
    .bi-cell.c6 {
      left: 56px;
      top: 0px;
      animation-name: bi-in-6, bi-merge-6;
      animation-delay: 0.12s, 0.78s;
    }
    .brand-intro.solo .bi-cell.c6 {
      animation-name: bi-in-6;
      animation-delay: 0.12s;
    }
    @keyframes bi-in-6 {
      from { opacity: 0; transform: translate(56px, -50px) scale(0.3); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes bi-merge-6 {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translate(-28px, 42px) scale(0.5); }
    }
    .bi-cell.c7 {
      left: 28px;
      top: 56px;
      animation-name: bi-in-7, bi-merge-7;
      animation-delay: 0.16s, 0.78s;
    }
    .brand-intro.solo .bi-cell.c7 {
      animation-name: bi-in-7;
      animation-delay: 0.16s;
    }
    @keyframes bi-in-7 {
      from { opacity: 0; transform: translate(25px, 74px) scale(0.3); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes bi-merge-7 {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translate(0px, -14px) scale(0.5); }
    }
    .bi-cell.c8 {
      left: 56px;
      top: 84px;
      animation-name: bi-in-8, bi-merge-8;
      animation-delay: 0.2s, 0.78s;
    }
    .brand-intro.solo .bi-cell.c8 {
      animation-name: bi-in-8;
      animation-delay: 0.2s;
    }
    @keyframes bi-in-8 {
      from { opacity: 0; transform: translate(62px, 56px) scale(0.3); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes bi-merge-8 {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translate(-28px, -42px) scale(0.5); }
    }
    .bi-pixel {
      position: absolute;
      left: 28px;
      top: 42px;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: linear-gradient(135deg, #F2A47B 0%, #D97757 60%, #B4552F 100%);
      opacity: 0;
      animation: bi-pixel 0.85s cubic-bezier(0.3, 0.7, 0.4, 1) 1.02s forwards;
    }
    @keyframes bi-pixel {
      0% { opacity: 0; transform: scale(0.4); }
      32% { opacity: 1; transform: scale(1.18); }
      52% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(3); }
    }
    .bi-word {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.4);
      opacity: 0;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      color: #F2F2F2;
      animation: bi-word 0.5s cubic-bezier(0.22, 1, 0.36, 1) 1.3s forwards;
    }
    .bi-word em {
      font-style: normal;
      background: linear-gradient(120deg, #F2A47B 0%, #D97757 55%, #C05C3E 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    @keyframes bi-word {
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

  </style>
</head>
<body data-title-key="title.reset">

  <div class="brand-intro" id="brand-intro" aria-hidden="true">
    <div class="bi-stage">
      <i class="bi-cell c1"></i>
      <i class="bi-cell c2"></i>
      <i class="bi-cell c3"></i>
      <i class="bi-cell c4"></i>
      <i class="bi-cell g c5"></i>
      <i class="bi-cell g c6"></i>
      <i class="bi-cell g c7"></i>
      <i class="bi-cell g c8"></i>
      <span class="bi-pixel"></span>
      <span class="bi-word">K<em>-ID</em></span>
    </div>
  </div>


  <div class="scene">
    <!-- Ambient background -->
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <main class="card">

      <div class="auth-brand">
        <span class="wordmark kid">K<em>-ID</em></span>
      </div>

      <!-- Step 1: request the code -->
      <form class="form active" id="form-request" novalidate>
        <h1 class="title" data-i18n="reset.title">Reset password.</h1>
        <p class="subtitle" data-i18n="reset.sub">Enter your account email — we'll send a 6-digit code.</p>

        <div class="group">
          <div class="field">
            <input type="email" id="reset-email" name="email" placeholder=" " autocomplete="email" required>
            <label for="reset-email" data-i18n="label.email">Email</label>
          </div>
        </div>
        <p class="group-error" data-error></p>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled data-i18n="reset.send">Send the code</button>

        <p class="note"><a class="link" href="/login" data-i18n="reset.back">Back to sign in</a></p>
      </form>

      <!-- Step 2: code + new password -->
      <form class="form" id="form-confirm" novalidate hidden>
        <h1 class="title" data-i18n="reset.codeTitle">Check your email.</h1>
        <p class="subtitle" id="reset-sub"></p>

        <p class="otp-label" data-i18n="verify.code">Verification code</p>
        <div class="otp" id="reset-otp" data-otp data-otp-target="reset-code"></div>
        <input type="hidden" id="reset-code">

        <div class="group" style="margin-top:16px">
          <div class="field">
            <input type="password" id="reset-password" placeholder=" " autocomplete="new-password" minlength="8" required>
            <label for="reset-password" data-i18n="reset.newPassword">New password (min 8 characters)</label>
          </div>
        </div>
        <p class="group-error" data-error></p>

        <button type="submit" class="submit" style="margin-top:18px" data-i18n="reset.confirm">Set new password</button>

        <p class="note"><a class="link" href="#" id="reset-again" data-i18n="reset.again">Start over</a></p>
      </form>

    </main>
  </div>

  <script src="ui.js?v=71"></script>
  <script src="reset.js?v=71"></script>
  <script>
    (function () {
      var el = document.getElementById('brand-intro');
      if (!el) return;
      /* CSS finishes the show; JS only tidies up the node afterwards */
      el.addEventListener('animationend', function (e) {
        if (e.target === el) el.remove();
      });
      setTimeout(function () { el.classList.add('done'); try { el.remove(); } catch (err) {} }, 3200);
    })();
  </script>
</body>
</html>
