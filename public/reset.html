<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0C0C0C">
  <title>Reset password — Kiliw Cloud</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=80">
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</head>
<body data-title-key="title.reset">

  <script>
    /* Brand intro, driven entirely by the Web Animations API: the overlay
       is built by this script with inline styles, so it cannot be broken
       by a stale stylesheet, cascade conflicts or reduce-motion CSS.
       Loader-sized: the K assembles from dots, collapses into a single
       dot; on auth pages the dot then bursts into the K-ID wordmark. */
    (function () {
      if (!window.Element || !Element.prototype.animate) return;
      var SOLO = false;
      var EASE_OUT = 'cubic-bezier(0.22,1,0.36,1)';
      var GRAD = 'linear-gradient(135deg,#F2A47B 0%,#D97757 60%,#B4552F 100%)';
      function play() {
        if (document.getElementById('brand-intro')) return;
        var ov = document.createElement('div');
        ov.id = 'brand-intro';
        ov.setAttribute('aria-hidden', 'true');
        ov.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;display:flex;align-items:center;justify-content:center;pointer-events:none;background:linear-gradient(160deg,#262626 0%,#161616 52%,#0C0C0C 100%)';
        var stage = document.createElement('div');
        stage.style.cssText = 'position:relative;width:36px;height:49px';
        ov.appendChild(stage);
        /* [left, top, fly-from-x, fly-from-y, delay]; first 4 cells form the
           white stem, the rest are the gradient rays */
        var cells = [
          [0, 0, -23, -26, 0], [0, 13, -31, -9, 50], [0, 26, -26, 12, 100], [0, 39, -20, 31, 150],
          [13, 13, 9, -31, 80], [26, 0, 26, -23, 120], [13, 26, 12, 34, 160], [26, 39, 29, 26, 200]
        ];
        cells.forEach(function (c, i) {
          var el = document.createElement('i');
          el.style.cssText = 'position:absolute;width:10px;height:10px;border-radius:3.5px;opacity:0;left:' + c[0] + 'px;top:' + c[1] + 'px;background:' + (i > 3 ? GRAD : '#F2F2F2');
          stage.appendChild(el);
          el.animate([
            { opacity: 0, transform: 'translate(' + c[2] + 'px,' + c[3] + 'px) scale(0.3)' },
            { opacity: 1, transform: 'translate(0,0) scale(1)' }
          ], { duration: 500, delay: c[4], easing: EASE_OUT, fill: 'both' });
          el.animate([
            { opacity: 1, transform: 'translate(0,0)' },
            { opacity: 0, transform: 'translate(' + (13 - c[0]) + 'px,' + (19 - c[1]) + 'px) scale(0.5)' }
          ], { duration: 360, delay: 780, easing: 'cubic-bezier(0.55,0,0.8,0.4)', fill: 'forwards' });
        });
        var px = document.createElement('i');
        px.style.cssText = 'position:absolute;left:13px;top:19px;width:10px;height:10px;border-radius:3.5px;opacity:0;background:' + GRAD;
        stage.appendChild(px);
        if (SOLO) {
          /* the single dot pulses once and melts away with the overlay */
          px.animate([
            { opacity: 0, transform: 'scale(0.4)', offset: 0 },
            { opacity: 1, transform: 'scale(1.3)', offset: 0.35 },
            { opacity: 1, transform: 'scale(1)', offset: 0.6 },
            { opacity: 0, transform: 'scale(0.6)', offset: 1 }
          ], { duration: 750, delay: 1020, easing: 'ease-in-out', fill: 'both' });
        } else {
          px.animate([
            { opacity: 0, transform: 'scale(0.4)', offset: 0 },
            { opacity: 1, transform: 'scale(1.18)', offset: 0.32 },
            { opacity: 1, transform: 'scale(1)', offset: 0.52 },
            { opacity: 0, transform: 'scale(3)', offset: 1 }
          ], { duration: 850, delay: 1020, easing: 'cubic-bezier(0.3,0.7,0.4,1)', fill: 'both' });
          var word = document.createElement('span');
          word.style.cssText = 'position:absolute;left:50%;top:50%;opacity:0;font-family:Manrope,-apple-system,BlinkMacSystemFont,sans-serif;font-size:29px;font-weight:800;letter-spacing:-0.03em;line-height:1;white-space:nowrap;color:#F2F2F2;transform:translate(-50%,-50%) scale(0.4)';
          word.appendChild(document.createTextNode('K'));
          var em = document.createElement('em');
          em.textContent = '-ID';
          em.style.cssText = 'font-style:normal;background:linear-gradient(120deg,#F2A47B 0%,#D97757 55%,#C05C3E 100%);-webkit-background-clip:text;background-clip:text;color:transparent';
          word.appendChild(em);
          stage.appendChild(word);
          word.animate([
            { opacity: 0, transform: 'translate(-50%,-50%) scale(0.4)' },
            { opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }
          ], { duration: 500, delay: 1300, easing: EASE_OUT, fill: 'both' });
        }
        document.body.appendChild(ov);
        var fade = ov.animate([{ opacity: 1 }, { opacity: 0 }],
          { duration: 400, delay: SOLO ? 1650 : 2100, fill: 'forwards' });
        fade.onfinish = function () { try { ov.remove(); } catch (e) {} };
        setTimeout(function () { try { ov.remove(); } catch (e) {} }, SOLO ? 3400 : 3900);
      }
      play();
      var hiddenAt = 0;
      window.addEventListener('pageshow', function (e) { if (e.persisted) play(); });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
        if (hiddenAt && Date.now() - hiddenAt > 1500) play();
      });
    })();
  </script>




  <div class="scene">
    <!-- Ambient background -->
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <main class="card">

      <div class="auth-brand">
        <span class="wordmark kid">K<em>-ID</em></span>
      </div>

      <!-- Step 1: request the code -->
      <form class="form active" id="form-request" novalidate>
        <h1 class="title" data-i18n="reset.title">Reset password.</h1>
        <p class="subtitle" data-i18n="reset.sub">Enter your account email — we'll send a 6-digit code.</p>

        <div class="group">
          <div class="field">
            <input type="email" id="reset-email" name="email" placeholder=" " autocomplete="email" required>
            <label for="reset-email" data-i18n="label.email">Email</label>
          </div>
        </div>
        <p class="group-error" data-error></p>

        <div class="turnstile-slot" data-turnstile></div>

        <button type="submit" class="submit" disabled data-i18n="reset.send">Send the code</button>

        <p class="note"><a class="link" href="/login" data-i18n="reset.back">Back to sign in</a></p>
      </form>

      <!-- Step 2: code + new password -->
      <form class="form" id="form-confirm" novalidate hidden>
        <h1 class="title" data-i18n="reset.codeTitle">Check your email.</h1>
        <p class="subtitle" id="reset-sub"></p>

        <p class="otp-label" data-i18n="verify.code">Verification code</p>
        <div class="otp" id="reset-otp" data-otp data-otp-target="reset-code"></div>
        <input type="hidden" id="reset-code">

        <div class="group" style="margin-top:16px">
          <div class="field">
            <input type="password" id="reset-password" placeholder=" " autocomplete="new-password" minlength="8" required>
            <label for="reset-password" data-i18n="reset.newPassword">New password (min 8 characters)</label>
          </div>
        </div>
        <p class="group-error" data-error></p>

        <button type="submit" class="submit" style="margin-top:18px" data-i18n="reset.confirm">Set new password</button>

        <p class="note"><a class="link" href="#" id="reset-again" data-i18n="reset.again">Start over</a></p>
      </form>

    </main>

    <footer class="auth-foot">
      <p class="app-copy">© 2026 KiliwCloud · a product of Synestix, LLC<br>2200 Porter Rd, Bear, DE 19701-2022, USA</p>
      <p class="auth-build">KW-50</p>
    </footer>

  </div>

  <script src="ui.js?v=80"></script>
  <script src="reset.js?v=80"></script>
</body>
</html>
