<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#26201b"/>
      <stop offset="60%" stop-color="#141110"/>
      <stop offset="100%" stop-color="#09090a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="48%">
      <stop offset="0" stop-color="#D97757" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EA8C61"/>
      <stop offset="1" stop-color="#C15E37"/>
    </linearGradient>
    <radialGradient id="hole" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#1c110b"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="232" r="205" fill="url(#glow)"/>

  <!-- isometric block: a Minecraft-style cube you unlock by signing in -->
  <g stroke="#7a3d22" stroke-width="3" stroke-linejoin="round">
    <!-- top face -->
    <polygon points="140,180 184,136 416,136 372,180" fill="#F4A87E"/>
    <!-- right face -->
    <polygon points="372,180 416,136 416,368 372,412" fill="#A94E2C"/>
    <!-- front face -->
    <rect x="140" y="180" width="232" height="232" fill="url(#front)"/>
  </g>

  <!-- pixel texture notches on the front face -->
  <g fill="#B4552F" opacity=".55">
    <rect x="170" y="206" width="20" height="20" rx="4"/>
    <rect x="322" y="230" width="20" height="20" rx="4"/>
    <rect x="180" y="356" width="20" height="20" rx="4"/>
    <rect x="316" y="372" width="18" height="18" rx="4"/>
  </g>

  <!-- keyhole -->
  <g>
    <circle cx="256" cy="286" r="30" fill="url(#hole)" stroke="#F2C7AF" stroke-width="3" stroke-opacity=".35"/>
    <polygon points="243,300 269,300 277,360 235,360" fill="url(#hole)"/>
    <circle cx="256" cy="280" r="9" fill="#0f0906"/>
  </g>
</svg>
