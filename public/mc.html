<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0C0C0C">
  <title>Join the server — K-ID</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=159">
  <style>
    .mc-card { text-align: center; }
    .mc-ico {
      width: 56px; height: 56px;
      margin: 6px auto 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 16px;
      color: #E8A38B;
      background: rgba(217, 119, 87, 0.10);
      border: 1px solid rgba(217, 119, 87, 0.2);
    }
    .mc-ico svg { width: 26px; height: 26px; }
    .mc-strong { font-weight: 800; color: var(--text); }
    .mc-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .mc-ok { font-size: 42px; margin: 10px 0 6px; }
    .mc-note { margin-top: 14px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  </style>
</head>
<body>

  <div class="scene">
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>

    <main class="card mc-card">
      <div class="auth-brand"><span class="wordmark kid">K<em>-ID</em></span></div>

      <div id="mc-loading"><p class="subtitle">One moment…</p></div>

      <div id="mc-open" hidden>
        <span class="mc-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </span>
        <h1 class="title" style="font-size:24px">Confirm in Telegram</h1>
        <p class="subtitle"><span class="mc-strong" id="mc-server"></span> wants to log you in as
          <span class="mc-strong" id="mc-nick"></span>.<br>Open the bot and approve.</p>
        <div class="mc-actions">
          <a class="submit" id="mc-open-btn" style="display:block;text-decoration:none">Open Telegram</a>
        </div>
        <p class="mc-note">Not opening?
          <a id="mc-open-web" rel="noopener" style="color:#E8A38B;text-decoration:underline">open via t.me</a></p>
      </div>

      <div id="mc-bad" hidden>
        <h1 class="title" style="font-size:24px">Link expired</h1>
        <p class="subtitle">Rejoin the server to get a fresh link in the chat.</p>
      </div>
    </main>
  </div>

  <script>
    (async () => {
      const panes = ['mc-loading', 'mc-open', 'mc-bad'];
      const show = (id) => panes.forEach((s) => { document.getElementById(s).hidden = s !== id; });
      const $ = (id) => document.getElementById(id);
      const token = (window.location.hash || '').slice(1);
      if (!/^[0-9a-f]{24,64}$/.test(token)) { show('mc-bad'); return; }

      const info = await fetch(`/api/mc?token=${token}&info=1`).then((r) => r.json()).catch(() => null);
      if (!info || info.status !== 'pending' || !info.bot) { show('mc-bad'); return; }

      /* tg:// opens the Telegram app directly (works even when t.me web is
         throttled); t.me stays as a fallback link */
      const tgUrl = `tg://resolve?domain=${info.bot}&start=mc_${token}`;
      const webUrl = `https://t.me/${info.bot}?start=mc_${token}`;
      $('mc-server').textContent = info.server;
      $('mc-nick').textContent = info.nick;
      $('mc-open-btn').href = tgUrl;
      $('mc-open-web').href = webUrl;
      show('mc-open');

      /* best-effort: try to launch the app straight away */
      setTimeout(() => { try { window.location.href = tgUrl; } catch (e) { /* keep the button */ } }, 400);
    })();
  </script>
</body>
</html>
