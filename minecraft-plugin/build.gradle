plugins {
    id 'java'
}

group = 'com.kiliw'
version = '1.0.0'

/* build with whatever JDK is installed (21 or newer),
   but always produce Java 21 bytecode for Paper */
compileJava {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

jar {
    archiveBaseName = 'KidAuth'
}
