plugins {
    id 'java'
}

group = 'com.kiliw'
version = '1.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    // FastLogin integration is wired via reflection — no compile-time dependency
}

jar {
    archiveBaseName = 'KidAuth'
}
