name: Build Minecraft plugin

on:
  push:
    paths:
      - 'minecraft-plugin/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: minecraft-plugin
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KidAuth
          path: minecraft-plugin/build/libs/*.jar

      # a stable download link that always points at the freshest jar:
      # .../releases/download/plugin-latest/KidAuth-1.0.0.jar
      - name: Publish to the plugin-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view plugin-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload plugin-latest minecraft-plugin/build/libs/*.jar --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create plugin-latest minecraft-plugin/build/libs/*.jar \
              --title "KidAuth plugin (latest build)" \
              --notes "Automatically built from the newest minecraft-plugin sources." \
              --repo "$GITHUB_REPOSITORY"
          fi
